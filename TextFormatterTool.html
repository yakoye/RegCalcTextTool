<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TextFormatter</title>
  <link rel="stylesheet" href="shared-ui.css">
  <script defer src="shared-ui.js"></script>
  <script defer src="vendor/marked/marked.umd.js"></script>
  <script defer src="vendor/turndown/turndown.umd.js"></script>
  <script defer src="vendor/js-yaml/js-yaml.min.js"></script>
  <script defer src="vendor/papaparse/papaparse.min.js"></script>
  <script defer src="vendor/he/he.js"></script>
  <script defer src="vendor/sax/sax.js"></script>
  <script defer src="text-formatter-core.js"></script>
  <script defer src="text-codecs.js"></script>
  <script defer src="text-generators.js"></script>
  <script defer src="markdown-table.js"></script>
  <script defer src="text-formatter.js"></script>
  <script defer src="markdown-table-ui.js"></script>
</head>
<body>
  <main class="tool-panel textformatter-panel" id="textconvert-ui">
    <header class="textformatter-header">
      <h3>文本处理工具 (TextFormatter)</h3>
      <label class="tc-save-toggle" for="text_save_text">
        <input type="checkbox" id="text_save_text">
        保存原文与结果
      </label>
    </header>

    <section class="tc-operation-frame" aria-label="文本操作">
      <div class="tc-groups" id="text_tool_groups"></div>
    </section>

    <section class="tc-parameter-panels" id="text_parameter_panels"
      aria-label="操作参数">
      <div class="tc-parameter-panel" data-panel="line" hidden>
        <div class="tc-panel-heading">
          <strong data-panel-title>行处理参数</strong>
          <span data-panel-description></span>
        </div>
        <div class="tc-option-grid">
          <label data-option-for="dedupeLines">
            <input type="checkbox" id="line_dedupe_ignore_case"> 忽略大小写
          </label>
          <label data-option-for="dedupeLines">
            <input type="checkbox" id="line_dedupe_trim"> 比较前去首尾空白
          </label>
          <label class="tc-field" data-option-for="filterLines">筛选文本
            <input type="text" id="line_filter_query">
          </label>
          <label data-option-for="filterLines">
            <input type="checkbox" id="line_filter_ignore_case"> 忽略大小写
          </label>
          <label data-option-for="filterLines">
            <input type="checkbox" id="line_filter_invert"> 排除匹配行
          </label>
          <label class="tc-field" data-option-for="prefixLines">前缀
            <input type="text" id="line_prefix" value="&gt; ">
          </label>
          <label class="tc-field" data-option-for="suffixLines">后缀
            <input type="text" id="line_suffix" value=";">
          </label>
          <label class="tc-field" data-option-for="quoteLines">左引号
            <input type="text" id="line_open_quote" value="&quot;">
          </label>
          <label class="tc-field" data-option-for="quoteLines">右引号
            <input type="text" id="line_close_quote" value="&quot;">
          </label>
          <label class="tc-field" data-option-for="splitByDelimiter joinByDelimiter">分隔符
            <input type="text" id="line_delimiter" value=",">
          </label>
          <label data-option-for="splitByDelimiter joinByDelimiter">
            <input type="checkbox" id="line_trim_parts" checked> 去首尾空白
          </label>
          <label data-option-for="splitByDelimiter joinByDelimiter">
            <input type="checkbox" id="line_filter_empty"> 忽略空项
          </label>
        </div>
        <button type="button" class="tc-primary-action" data-run-selected>执行</button>
      </div>

      <div class="tc-parameter-panel" data-panel="structured" hidden>
        <div class="tc-panel-heading">
          <strong data-panel-title>数据格式化</strong>
          <span data-panel-description></span>
        </div>
        <div class="tc-option-grid">
          <label class="tc-field">JSON 缩进
            <select id="structured_indent">
              <option value="2">2 空格</option>
              <option value="4">4 空格</option>
            </select>
          </label>
        </div>
        <button type="button" class="tc-primary-action" data-run-selected>执行转换</button>
      </div>

      <div class="tc-parameter-panel" data-panel="hex" hidden>
        <div class="tc-panel-heading">
          <strong data-panel-title>Hex 与字节</strong>
          <span data-panel-description></span>
        </div>
        <fieldset class="tc-segmented">
          <legend>输入模式</legend>
          <label><input type="radio" name="hex_mode" value="strict" checked> Strict</label>
          <label><input type="radio" name="hex_mode" value="clean"> Clean</label>
        </fieldset>
        <button type="button" class="tc-primary-action" data-run-selected>执行转换</button>
      </div>

      <div class="tc-parameter-panel" data-panel="base64" hidden>
        <div class="tc-panel-heading">
          <strong>Base64 文件</strong>
          <span>文件字节仅保存在当前页面内存中；单个文件与解码结果最多 16 MiB</span>
        </div>
        <input type="file" id="base64_file_input" class="tc-visually-hidden" hidden>
        <div id="base64_drop_zone" class="tc-drop-zone" role="button" tabindex="0"
          aria-controls="base64_file_input">
          选择文件或拖放到这里
        </div>
        <div id="base64_file_info" class="tc-file-info">尚未选择文件</div>
        <div class="tc-option-grid">
          <label class="tc-field">输出形式
            <select id="base64_output_mode">
              <option value="plain">纯 Base64</option>
              <option value="data-url">Data URL</option>
            </select>
          </label>
          <label class="tc-field">字符集
            <select id="base64_variant">
              <option value="standard">标准 Base64</option>
              <option value="url">URL-safe</option>
            </select>
          </label>
          <label class="tc-field">MIME
            <input type="text" id="base64_mime" value="application/octet-stream">
          </label>
          <label class="tc-field">下载名
            <input type="text" id="base64_download_name" value="decoded.bin">
          </label>
        </div>
        <div class="tc-panel-actions">
          <button type="button" class="tc-primary-action" id="base64_encode_file">编码文件</button>
          <button type="button" id="base64_decode_input">从当前原文解码</button>
          <button type="button" id="base64_preview">图片预览</button>
          <button type="button" id="base64_download">下载</button>
          <button type="button" id="base64_clear">清空</button>
        </div>
        <div class="tc-image-preview" id="base64_preview_area" hidden>
          <img id="base64_preview_image" alt="Base64 图片预览">
        </div>
      </div>

      <div class="tc-parameter-panel" data-panel="sequence" hidden>
        <div class="tc-panel-heading">
          <strong>序列生成</strong>
          <span>最多生成 10000 项</span>
        </div>
        <div class="tc-option-grid tc-sequence-grid">
          <label class="tc-field">开始
            <input type="number" id="sequence_start" value="1">
          </label>
          <label class="tc-field">结束
            <input type="number" id="sequence_end" value="50">
          </label>
          <label class="tc-field tc-sequence-field-width">位数
            <input type="number" id="sequence_width" value="0" min="0" max="10">
          </label>
          <label class="tc-field tc-sequence-field-count">数量
            <input type="number" id="sequence_count" min="1" max="10000"
              placeholder="全部">
          </label>
          <label class="tc-field tc-sequence-field-radix">进制
            <select id="sequence_radix">
              <option value="10">十进制</option>
              <option value="16">十六进制</option>
            </select>
          </label>
          <label class="tc-field tc-sequence-field-order">顺序
            <select id="sequence_order">
              <option value="range">按范围</option>
              <option value="asc">升序</option>
              <option value="desc">降序</option>
              <option value="random">随机</option>
            </select>
          </label>
          <label class="tc-field tc-sequence-field-separator">分隔方式
            <select id="sequence_separator_mode">
              <option value="newline">换行</option>
              <option value="space">空格</option>
              <option value="comma">逗号</option>
              <option value="custom">自定义</option>
            </select>
          </label>
          <label class="tc-field tc-sequence-field-custom"
            id="sequence_separator_custom_field" hidden>自定义分隔符
            <input type="text" id="sequence_separator_custom" value="," disabled>
          </label>
        </div>
        <div class="tc-panel-actions">
          <button type="button" class="tc-primary-action" id="sequence_to_output">生成到结果</button>
          <button type="button" id="sequence_to_input">生成到原文</button>
        </div>
      </div>

      <div class="tc-parameter-panel markdown-table-section" data-panel="table"
        id="markdown_table_section" hidden>
        <div class="tc-panel-heading">
          <strong>表格与 Markdown</strong>
          <span>表格区域可单独横向滚动</span>
        </div>
        <div class="markdown-table-workspace">
          <div class="markdown-table-import">
            <textarea id="markdown_table_source" rows="4"
              placeholder="粘贴 Markdown 表格、HTML 表格或 TSV 数据"></textarea>
            <div class="markdown-table-actions">
              <button type="button" data-table-action="import-gfm">导入 Markdown</button>
              <button type="button" data-table-action="import-html">导入 HTML</button>
              <button type="button" data-table-action="import-tsv">导入 TSV</button>
              <button type="button" data-table-action="clear-source">清空</button>
            </div>
          </div>
          <div class="markdown-table-toolbar" aria-label="表格编辑操作">
            <button type="button" data-table-action="add-row">+ 行</button>
            <button type="button" data-table-action="remove-row">- 行</button>
            <button type="button" data-table-action="add-column">+ 列</button>
            <button type="button" data-table-action="remove-column">- 列</button>
            <button type="button" data-table-action="merge">合并所选</button>
            <button type="button" data-table-action="split">拆分所选</button>
            <label class="markdown-table-header-toggle">
              <input type="checkbox" id="markdown_table_header" checked>
              首行为表头
            </label>
          </div>
          <p class="markdown-table-hint">选择连续矩形单元格后可合并；可视化编辑最多 2500 个单元格。</p>
          <div class="markdown-table-grid-wrap">
            <div id="markdown_table_grid" class="markdown-table-grid"
              aria-label="可编辑表格"></div>
          </div>
          <div class="markdown-table-actions markdown-table-export-actions">
            <button type="button" class="primary-action"
              data-table-action="export-gfm">生成 Markdown</button>
            <button type="button" data-table-action="export-html">生成 HTML</button>
            <button type="button" data-table-action="export-tsv">生成 TSV</button>
            <button type="button" data-table-action="copy">复制结果</button>
          </div>
          <div id="markdown_table_status" class="markdown-table-status"
            role="status" aria-live="polite"></div>
        </div>
      </div>
    </section>

    <div class="tc-workflow-bar">
      <div id="textformatter_status" class="tc-status" role="status"
        aria-live="polite"></div>
      <button type="button" id="text_clear_all">清空全部</button>
    </div>

    <section class="tc-text-workspace" aria-label="文本输入和处理结果">
      <div class="tc-editor-pane">
        <div class="tc-editor-header">
          <label for="textconvert_input">原文</label>
          <button type="button" id="text_clear_input">清空</button>
        </div>
        <textarea id="textconvert_input" autocomplete="off" spellcheck="false"
          placeholder="输入或粘贴原文"></textarea>
        <div class="tc-stats" id="text_input_stats">
          字符 <span data-stat="characters">0</span> ·
          行 <span data-stat="lines">0</span> ·
          UTF-8 <span data-stat="bytes">0</span> 字节
        </div>
      </div>

      <div class="tc-transfer-actions" aria-label="文本传递操作">
        <button type="button" id="text_swap" title="交换原文与结果"
          aria-label="交换原文与结果">⇄</button>
        <button type="button" id="text_use_output" title="结果作为原文"
          aria-label="结果作为原文">←</button>
      </div>

      <div class="tc-editor-pane">
        <div class="tc-editor-header">
          <label for="textconvert_output">结果</label>
          <div class="tc-inline-actions">
            <button type="button" id="text_copy_output">复制</button>
            <button type="button" id="text_clear_output">清空</button>
          </div>
        </div>
        <textarea id="textconvert_output" autocomplete="off" spellcheck="false"
          placeholder="处理结果"></textarea>
        <div class="tc-stats" id="text_output_stats">
          字符 <span data-stat="characters">0</span> ·
          行 <span data-stat="lines">0</span> ·
          UTF-8 <span data-stat="bytes">0</span> 字节
        </div>
      </div>
    </section>
  </main>
</body>
</html>
